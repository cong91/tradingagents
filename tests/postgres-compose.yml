services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
    ports:
      # The host port must stay BELOW the OS ephemeral ranges (Linux 32768+,
      # Windows 49152+): a listener inside them collides with the source port the
      # OS hands a client, and connects fail with WSAEADDRINUSE/EADDRINUSE.
      # Projects running this file at the same time pass their own
      # TRADINGAGENTS_TEST_PG_PORT (migration integration tests pick a free one).
      - "127.0.0.1:${TRADINGAGENTS_TEST_PG_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration_test"]
      interval: 1s
      timeout: 3s
      retries: 30
