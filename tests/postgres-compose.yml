services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
    ports:
      # Host port must stay BELOW the Windows dynamic (ephemeral client) range
      # 49152-65535: a listener inside that range collides with the OS-assigned
      # client source port and fails connects with WSAEADDRINUSE (10048).
      - "127.0.0.1:32768:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration_test"]
      interval: 1s
      timeout: 3s
      retries: 30
