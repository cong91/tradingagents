services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: migration_test
      POSTGRES_USER: migration
      POSTGRES_PASSWORD: migration
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U migration -d migration_test"]
      interval: 1s
      timeout: 3s
      retries: 30
